CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# The 1M/1M divider presents half of the AA voltage to P0.31/AIN7.
# These ADC-side thresholds correspond to 1.55 V, 1.00 V, and 0.85 V at the cell.
CONFIG_ZMK_NON_LIPO_MAX_MV=775
CONFIG_ZMK_NON_LIPO_MIN_MV=500
CONFIG_ZMK_NON_LIPO_LOW_MV=425

# Keep advertising timeout shutdown out of the battery-reporting test.
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=0
