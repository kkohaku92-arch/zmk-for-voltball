CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# P0.31/AIN7 is connected to the midpoint of a fixed 1M/1M divider, so the
# driver reads half of the actual AA voltage. This module compares the raw ADC
# millivolts directly and does not compensate for the divider.
#
# This shared profile supports both 1.3 V rechargeable NiMH and 1.5 V alkaline
# cells without requiring different firmware:
#   650 mV at ADC = 1.30 V at cell = 100%
#   500 mV at ADC = 1.00 V at cell = 0%
#   450 mV at ADC = 0.90 V at cell = low-voltage shutdown
#
# A fresh alkaline cell above 1.30 V will remain at 100% until it falls below
# 1.30 V. That is the unavoidable tradeoff when one linear profile must also
# report a fully charged 1.30 V NiMH cell as 100%.
CONFIG_ZMK_NON_LIPO_MAX_MV=650
CONFIG_ZMK_NON_LIPO_MIN_MV=500
CONFIG_ZMK_NON_LIPO_LOW_MV=450

# For alkaline-only firmware, use MAX_MV=750 (1.50 V at the cell).
# For NiMH-only firmware, keep MAX_MV=650 (1.30 V at the cell).
# MIN_MV and LOW_MV can remain unchanged for either profile.

# Keep advertising timeout shutdown out of the battery-reporting test.
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=0
